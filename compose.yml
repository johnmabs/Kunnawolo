services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: kunnawolo
      POSTGRES_USER: kunnawolo
      POSTGRES_PASSWORD: kunnawolo_dev
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - kunnawolo-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

volumes:
  kunnawolo-postgres-data:
